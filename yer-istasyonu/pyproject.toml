[project]
name = "akana-yer-istasyonu"
version = "0.1.0"
description = "AKANA yer istasyonu: E22 alıcılarından telemetri çözümleme, kayıt ve WebSocket yayını"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pyserial>=3.5"]

[project.optional-dependencies]
app = ["pywebview>=5.0"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
akana-yi = "yi_core.__main__:main"

[tool.setuptools]
packages = ["yi_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
