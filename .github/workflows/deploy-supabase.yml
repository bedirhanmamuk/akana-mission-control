# Veritabanı migration'larını ve admin-users Edge Function'ını Supabase projesine uygular.
# Gerekli depo sırları (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_ACCESS_TOKEN   supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_REF    proje adresindeki kimlik (https://<BU KISIM>.supabase.co)
#   SUPABASE_DB_PASSWORD    projeyi oluştururken belirlenen veritabanı şifresi
# Sırlar tanımlı değilse iş akışı hiçbir şey yapmadan biter.
name: Supabase'i kur / güncelle

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Sırları kontrol et
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase sırları tanımlı değil; kurulum atlandı. GITHUB-KURULUM.md dosyasına bakın."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest
      - name: Projeye bağlan
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migration'ları uygula
        if: steps.check.outputs.ready == 'true'
        run: supabase db push --include-all
      - name: Edge Function'ı dağıt
        if: steps.check.outputs.ready == 'true'
        run: |
          supabase functions deploy admin-users --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy ai-insights --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
