<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKANA Yer İstasyonu</title>
<meta name="description" content="Open MCT tabanlı AKANA yer istasyonu (simülasyon modu)">
<style>
/* Open MCT (Espresso teması) üzerine AKANA panelleri. Renk yalnızca anlam taşır: mavi roket, turuncu görev yükü, mor marka, yeşil/sarı/kırmızı durum. */
:root{ color-scheme:dark;
  --a-text:#d6d6d6; --a-muted:#a3a3a3; --a-faint:#858585; --a-edge:#4b4b4b; --a-rule:#3e3e3e; --a-bg:#2f2f2f; --a-bg2:#262626;
  --a-rk:#4aa3ff; --a-pl:#ff9a3c; --a-brand:#9b5cff; --a-ok:#41c37a; --a-warn:#e8ad40; --a-bad:#f26161; }
html,body{height:100%;margin:0;background:#1f1f1f}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#simbar{flex:none;height:24px;display:flex;align-items:center;justify-content:center;gap:14px;font:600 11px/24px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.16em;color:#efe6ff;
  background:repeating-linear-gradient(135deg,#3a2f63 0 9px,#30274f 9px 18px);border-bottom:1px solid #5b4a9a}
#simbar span{letter-spacing:0;font-weight:400;color:#cfc2f2}
#simbar button{all:unset;cursor:pointer;letter-spacing:0;font-weight:500;padding:0 9px;height:16px;line-height:16px;border:1px solid #7a68c0;border-radius:3px;color:#efe6ff}
#simbar button:focus-visible{outline:2px solid #fff}
#simbar .logo{display:flex;align-items:center;gap:8px;letter-spacing:.12em}
#simbar .logo svg{width:15px;height:16px}
#omct{flex:1;min-height:0;position:relative;contain:strict}
[hidden]{display:none!important}

/* ---- AKANA görünümleri ---- */
.akv{height:100%;box-sizing:border-box;color:var(--a-text);font:12px/16px "Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;font-variant-numeric:tabular-nums}
.akv b{font-weight:600}
.akv-sub{font-size:11px;font-weight:600;color:var(--a-faint);letter-spacing:.06em;text-transform:uppercase;margin:6px 2px 6px}
.akv-ph{padding:4px 8px;display:flex;flex-direction:column}
.akv-tl{display:grid;gap:4px}
.akv-step{display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:8px;height:24px;padding:0 8px 0 4px;border-radius:4px;background:var(--a-bg2);border:1px solid var(--a-rule);color:var(--a-faint)}
.akv-step i{width:10px;height:10px;border-radius:50%;border:2px solid #5e5e5e;box-sizing:border-box}
.akv-step b{font-weight:500}
.akv-step span{font:500 11px "Menlo","Consolas",monospace;color:var(--a-faint)}
.akv-step.done{color:var(--a-text)} .akv-step.done i{background:var(--a-ok);border-color:var(--a-ok)} .akv-step.done span{color:var(--a-ok)}
.akv-step.now{background:rgba(155,92,255,.22);border-color:var(--a-brand);color:#fff} .akv-step.now i{border-color:var(--a-brand);background:var(--a-brand);box-shadow:0 0 0 3px rgba(155,92,255,.3)} .akv-step.now span{color:#e3d6ff}
.akv-step.safe{border-style:dashed}
.akv-chk{display:grid}
.akv-ck{display:flex;justify-content:space-between;align-items:center;height:22px;border-bottom:1px solid var(--a-rule)}
.akv-ck span{color:var(--a-muted)}
.akv-ck b{font:600 11.5px "Menlo","Consolas",monospace}
.akv-ok{color:var(--a-ok)!important}.akv-warn{color:var(--a-warn)!important}.akv-bad{color:var(--a-bad)!important}.akv-na{color:var(--a-faint)!important}
.akv-log{padding:2px 6px;overflow:auto}
.akv-le{display:grid;grid-template-columns:60px 10px 1fr;gap:6px;padding:4px 0;border-bottom:1px solid var(--a-rule);align-items:start}
.akv-le span{font:500 11px/16px "Menlo","Consolas",monospace;color:var(--a-faint)}
.akv-le i{width:7px;height:7px;border-radius:50%;margin-top:5px;background:var(--a-ok)}
.akv-le.akv-warn i{background:var(--a-warn)} .akv-le.akv-err i{background:var(--a-bad)}
.akv-le.akv-warn,.akv-le.akv-err{color:var(--a-text)!important}
.akv-le em{display:block;font-style:normal;font:400 10.5px "Menlo","Consolas",monospace;color:var(--a-faint)}
.akv-tbl{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.akv-tbl th:first-child{width:34%}
.akv-tbl th{text-align:right;color:var(--a-muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--a-edge)}
.akv-tbl td{text-align:right;padding:0 4px;height:20px;border-bottom:1px solid var(--a-rule);font:500 10.5px "Menlo","Consolas",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.akv-tbl td:first-child,.akv-tbl th:first-child{text-align:left;font:400 11.5px "Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--a-muted)}
.akv-map{position:relative}
.akm-svg{position:absolute;inset:0;width:100%;height:100%}
#ov text{paint-order:stroke;stroke:rgba(10,10,10,.85);stroke-width:3px;stroke-linejoin:round}
.akm-wm{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) rotate(-10deg);font:700 46px/1 Helvetica,Arial,sans-serif;letter-spacing:.16em;color:rgba(255,255,255,.07);pointer-events:none}
.akm-leg,.akm-lay,.akm-zoom{position:absolute;display:flex;background:rgba(20,20,20,.86);border:1px solid #555;border-radius:4px;overflow:hidden}
.akm-leg{left:8px;top:8px;flex-direction:column}
.akm-lay{right:8px;top:8px}
.akm-zoom{left:8px;bottom:34px;flex-direction:column}
.akv-map button{all:unset;cursor:pointer;padding:0 9px;height:22px;line-height:22px;font-size:11.5px;color:#bbb}
.akv-map button.on{color:#fff;background:#0b7fc7}
.akm-leg button.on{background:none;color:#fff;font-weight:600}
.akm-zoom button{width:24px;padding:0;text-align:center;font:500 14px/22px Menlo,monospace}
.akv-map button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.akm-scale{position:absolute;left:40px;bottom:34px;font:400 10.5px Menlo,monospace;color:#eee;background:rgba(20,20,20,.7);padding:2px 6px;border-radius:3px}
.akm-foot{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;gap:8px;padding:0 10px;background:rgba(20,20,20,.88);font-size:11px;color:#aaa;white-space:nowrap}
.akm-foot b{color:#eee;font:500 11px Menlo,monospace}
.akm-attr{margin-left:auto;font:400 10px Menlo,monospace;color:#888}
.akv-att{display:flex;flex-direction:column}
.akv-att .r3d{flex:1;position:relative;min-height:0;background:radial-gradient(140% 70% at 50% 120%,#3b3b4f 0%,#2a2a33 35%,transparent 65%),#232323}
.akv-att .r3d canvas{position:absolute;inset:0}
.akv-att .cmp{display:none}
.akv-att .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--a-faint)}
.akv-attv{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:4px 0 6px}
.akv-attv label{display:block;font-size:10.5px;color:var(--a-faint)}
.akv-attv b{font:600 13px "Menlo","Consolas",monospace}
.akv-ref{display:flex;flex-direction:column;padding:10px}
.akv-refh{font:600 12px/30px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.1em;color:#efe6ff;background:repeating-linear-gradient(135deg,#3a2f63 0 9px,#30274f 9px 18px);text-align:center;border-radius:4px;margin-bottom:10px}
.akv-rgrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;min-height:0}
.akv-rc{background:var(--a-bg2);border:1px solid var(--a-edge);border-radius:6px;padding:16px 22px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.akv-rc label{font-size:14px;color:var(--a-muted)}
.akv-rc b{font:600 48px/1.05 "Helvetica Neue",Helvetica,Arial,sans-serif;white-space:nowrap}
.akv-rc b.sm{font:500 24px/1.3 "Menlo","Consolas",monospace}
.akv-rc span{font:400 13px "Menlo","Consolas",monospace;color:var(--a-faint)}
</style>

<div id="app">
  <div id="simbar"><span class="logo"><svg viewBox="640 468 720 756" aria-hidden="true"><polygon points="985,484 988,686 838,946 663,1067" fill="#a335f5"/><polygon points="1000,478 1000,683 1147,932 1328,1056" fill="#7a1fd8"/><polygon points="655,1097 998,862 998,973 655,1210" fill="#5a1fb8"/><polygon points="998,862 1344,1090 1345,1206 998,973" fill="#3a1284"/></svg>AKANA</span>
    SİMÜLASYON MODU <span>Veriler dahili simülatörden gelir, gerçek uçuş verisi değildir.</span><button id="restart">Yeniden başlat</button></div>
  <div id="omct"><div id="omct-mount"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="tiles.js"></script>
<script src="openmct/openmct.js"></script>
<script src="akana.js"></script>
<script>
  // Open MCT kurulumu
  const ONE_MIN = 60 * 1000;
  openmct.setAssetPath('openmct/');
  openmct.install(openmct.plugins.LocalStorage());
  openmct.install(openmct.plugins.MyItems());
  openmct.install(openmct.plugins.UTCTimeSystem());
  openmct.install(openmct.plugins.Espresso());
  openmct.install(openmct.plugins.Clock({ enableClockIndicator: true }));
  openmct.install(openmct.plugins.Notebook());
  openmct.install(openmct.plugins.LADTable());
  openmct.install(openmct.plugins.Conductor({ menuOptions: [
    { name:'Gerçek zaman', timeSystem:'utc', clock:'local', clockOffsets:{ start:-6 * ONE_MIN, end:10 * 1000 } },
    { name:'Sabit aralık', timeSystem:'utc', bounds:{ start:Date.now() - 12 * ONE_MIN, end:Date.now() + ONE_MIN } }
  ] }));
  openmct.install(AkanaPlugin());
  openmct.time.setTimeSystem('utc');

  // Simülasyon gerçek zamanla yürür; T, duvar saatinden türetilir
  boot();
  setInterval(() => { UI.T = (Date.now() - EPOCH) / 1000; if (UI.T < Flight.tLand + 60) step(UI.T); }, 100);
  document.getElementById('restart').onclick = () => location.reload();

  if (!location.hash || location.hash === '#') location.hash = '#/browse/akana:root/akana:ops';
  openmct.start(document.getElementById('omct-mount'));
  // Denetçi paneli varsayılan olarak kapalı: ekran telemetriye kalsın
  setTimeout(() => { const b = document.querySelector('.l-shell__pane-inspector .l-pane__collapse-button'); b && b.click(); }, 400);
</script>
</html>
